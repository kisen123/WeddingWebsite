version: 2

# All dependency PRs target develop, never master (master = production).
updates:
  - package-ecosystem: npm
    directory: /frontend
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: nuget
    directory: /backend/api
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    labels: [dependencies]

  - package-ecosystem: docker
    directories: [/frontend, /backend/api]
    target-branch: develop
    schedule:
      interval: monthly
    labels: [dependencies]
